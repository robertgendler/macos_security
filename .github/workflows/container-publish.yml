name: Build and Publish Container

on:
  workflow_run:
    workflows: ["CLI Smoke Tests", "Generate Baselines and Increment Build"]
    types: [completed]
    branches: [main, dev_27]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/mscp_2.0

jobs:
  # ---------------------------------------------------------------------------
  # Build each architecture natively.
  #
  # amd64 -> ubuntu-24.04
  # arm64 -> ubuntu-24.04-arm
  #
  # This avoids QEMU entirely.
  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.arch }}
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && (
        (github.event.workflow_run.name == 'Generate Baselines and Increment Build' &&
         github.repository == 'usnistgov/macos_security' &&
         !contains(github.event.workflow_run.head_commit.message, '[skip ci]')) ||
        (github.event.workflow_run.name == 'CLI Smoke Tests' &&
         github.repository != 'usnistgov/macos_security')
      ))

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04

          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    permissions:
      contents: read
      packages: write
      actions: read

    steps:
      - name: Verify lint passed
        if: >
          github.event_name != 'workflow_dispatch' &&
          github.event.workflow_run.name == 'CLI Smoke Tests'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          repo="${{ github.repository }}"

          wf_id=$(
            gh api "repos/$repo/actions/workflows" \
              --jq '.workflows[] | select(.name == "Lint Code Base") | .id'
          )

          result=$(
            gh api \
              "repos/$repo/actions/workflows/$wf_id/runs?head_sha=$SHA&per_page=1" \
              --jq '.workflow_runs[0].conclusion // empty'
          )

          if [[ "$result" != "success" ]]; then
            echo "Lint Code Base did not pass (conclusion: ${result:-not found})"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # No QEMU setup is required. Each architecture runs natively.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine source information
        id: source
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          branch="${HEAD_BRANCH:-${{ github.ref_name }}}"
          sha="${WORKFLOW_SHA:-${{ github.sha }}}"

          echo "branch=${branch}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

          if [[ "$branch" == "main" ]]; then
            echo "image_tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=${branch}" >> "$GITHUB_OUTPUT"
          fi

          short_sha="${sha:0:7}"

          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "temp_tag=build-${short_sha}-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.arch }} image
        id: build-push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: .github/container/Dockerfile

          # Exactly one native architecture is built by each runner.
          platforms: ${{ matrix.platform }}

          push: true

          # Publish temporary architecture-specific images.
          # The merge job below creates the public multi-arch tags.
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.source.outputs.temp_tag }}

          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}

          build-args: |
            BUILD_SHA=${{ steps.source.outputs.sha }}
            IMAGE_REPO=${{ github.repository }}
            IMAGE_TAG=${{ steps.source.outputs.image_tag }}

          # Give each architecture its own cache scope so amd64 and arm64
          # do not overwrite one another's BuildKit cache.
          cache-from: |
            type=gha,scope=container-${{ matrix.arch }}
          cache-to: |
            type=gha,mode=max,scope=container-${{ matrix.arch }}

  # ---------------------------------------------------------------------------
  # Combine the two native images into a multi-platform manifest.
  # ---------------------------------------------------------------------------
  merge-and-publish:
    name: Publish multi-arch image
    needs: build
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine source information
        id: source
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          branch="${HEAD_BRANCH:-${{ github.ref_name }}}"
          sha="${WORKFLOW_SHA:-${{ github.sha }}}"
          short_sha="${sha:0:7}"

          echo "branch=${branch}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"

          if [[ "$branch" == "main" ]]; then
            echo "is_main=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_main=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main,enable=${{ steps.source.outputs.is_main == 'true' }}
            type=raw,value=latest,enable=${{ steps.source.outputs.is_main == 'true' }}
            type=raw,value=${{ steps.source.outputs.branch }},enable=${{ steps.source.outputs.is_main != 'true' }}
            type=sha,prefix=sha-,format=short

      - name: Create and push multi-arch manifest
        id: manifest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          SHORT_SHA: ${{ steps.source.outputs.short_sha }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          amd64_image="${IMAGE}:build-${SHORT_SHA}-amd64"
          arm64_image="${IMAGE}:build-${SHORT_SHA}-arm64"

          echo "Creating multi-architecture image from:"
          echo "  ${amd64_image}"
          echo "  ${arm64_image}"

          tag_args=()

          while IFS= read -r tag; do
            if [[ -n "$tag" ]]; then
              tag_args+=("--tag" "$tag")
            fi
          done <<< "$TAGS"

          docker buildx imagetools create \
            "${tag_args[@]}" \
            "$amd64_image" \
            "$arm64_image"

          # All final tags point to the same manifest digest.
          first_tag=$(printf '%s\n' "$TAGS" | head -n 1)

          digest=$(
            docker buildx imagetools inspect "$first_tag" \
              --format '{{json .Manifest.Digest}}' |
              tr -d '"'
          )

          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Published manifest digest: ${digest}"

      - name: Inspect published multi-arch image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          first_tag=$(printf '%s\n' "$TAGS" | head -n 1)
          docker buildx imagetools inspect "$first_tag"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image with cosign
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          COSIGN_REGISTRY_USERNAME: ${{ github.actor }}
          COSIGN_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Generate build provenance attestation
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
```
